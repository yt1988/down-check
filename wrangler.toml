# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public and the Worker in src/worker.js.
# A request for a file in public/ is served without running the Worker (free and not metered); the Worker only sees
# /api/status.json and unknown paths. No routes or custom domain here: on 1ms.dog the shell routes the domain to this
# Worker. To self-host, bind your own domain in the dashboard (see README).
name = "down-check"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false
# The four probe addresses are Worker *secrets* (PROBE_LAX_URL, PROBE_NUREMBERG_URL, PROBE_TOKYO_URL,
# PROBE_SHANGHAI_URL), set with
# `wrangler secret put`. Secrets survive a deploy; `keep_vars` is for plain vars and is not needed (and an older
# wrangler in Workers Builds rejects the key).

[assets]
directory = "./public"
binding = "ASSETS"
