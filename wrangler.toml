# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public and the Worker in src/worker.js.
# A request for a file in public/ is served without running the Worker (free and not metered); the Worker only sees
# /api/status.json and unknown paths. No routes or custom domain here: on 1ms.dog the shell routes the domain to this
# Worker. To self-host, bind your own domain in the dashboard (see README).
name = "down-check"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false
# The three probe addresses live in the deployment, as secrets (PROBE_LAX_URL, PROBE_TOKYO_URL, PROBE_SHANGHAI_URL).
# Without this, `wrangler deploy` would delete every var it does not find in this file before setting its own.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
